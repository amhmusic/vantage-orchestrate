services:
  vantage-collect:
    image: flokimon/vantage:vantage-collect-0.1.1
    depends_on:
      - vantage-db
      - vantage-api
    environment:
      - GRAPHQL_API_URL=http://vantage-api:8080/v1/graphql
      - OPENSKY_CLIENT_ID=flokimon-api-client
      - OPENSKY_SECRET=UwKW7db1UDxIwthKNTILuyazSsVARPr9
    networks:
      - vantage-network
  vantage-db:
    image: flokimon/vantage:vantage-db-0.1.0
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_DB=vantage-db
      - POSTGRES_PORT=5432
    networks:
      - vantage-network
  vantage-ui:
    image: flokimon/vantage:vantage-ui-0.1.2
    restart: unless-stopped
    ports:
      - "8080:80"
    environment:
      - VITE_API_URL=http://localhost:5000/v1/graphql
      - VITE_WS_URL=ws://localhost:5000/v1/graphql
    depends_on:
      - vantage-api
      - vantage-db
    networks:
      - vantage-network
  vantage-api:
    image: flokimon/vantage:vantage-api-0.1.0
    restart: unless-stopped
    ports:
      - "5000:8080"
    environment:
      - HASURA_GRAPHQL_DATABASE_URL=postgres://postgres:postgres@vantage-db:5432/vantage-db
      - HASURA_GRAPHQL_ENABLE_CONSOLE=true
    depends_on:
      - vantage-db
    networks:
      - vantage-network
networks:
  vantage-network: